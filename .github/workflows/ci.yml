name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm test
        env:
          ALLOW_DEMO_LOGIN: 'true'
          JWT_SECRET: ci_jwt_secret_min_32_characters_long
